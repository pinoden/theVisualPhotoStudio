# The checks every change must pass before it can be merged into master.
# Branch protection on master requires all three jobs to pass: "checks", "browser" and "webkit" (the browser suite in
# Safari's engine; since 2026-11-20, after five runs in a row passed). No job retries a failed test (AGENTS.md).
# The site needs no secrets for these: it uses its embedded database and the pretend card processor.
# The repository is public, so GitHub's standard runners cost nothing here.

name: CI

on:
  pull_request:
    branches: [master, rebuild] # rebuild: Dependabot's update pull requests
  push:
    branches: [rebuild, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc # the one Node version: on developers' machines, here and on the host
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unused files, exports and packages
        run: npm run knip
      - name: Unit and integration tests
        run: npm test

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc # the one Node version: on developers' machines, here and on the host
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 14

  webkit:
    # The same browser suite in WebKit, the engine of Safari and of every browser on an iPhone.
    name: webkit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc # the one Node version: on developers' machines, here and on the host
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Browser tests in WebKit
        run: npx playwright test --browser=webkit
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Its own build, database and results folders, named as on a developer's machine (ProjectLibrary.md).
          E2E_NAME: webkit
      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-test-results
          path: web/test-results-webkit/
          retention-days: 14
