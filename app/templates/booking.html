{% extends "base.html" %}

{% block content %}
  <h1>Booking</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    {{ form.name.label }} {{ form.name() }}<br>
    {{ form.email.label }} {{ form.email() }}<br>
    {{ form.date.label }} {{ form.date() }}<br>
    {{ form.time.label }} {{ form.time() }}<br>
    {{ form.submit() }}
  </form>
{% endblock %}
